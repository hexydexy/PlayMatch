<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayMatch</title>
<meta name="description" content="Compare PC game prices across Steam, GOG and Epic, and see whether today's price is a good one.">
<link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#view" data-skip>Skip to content</a>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="#/" aria-label="PlayMatch, all games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3 4a1 1 0 0 1 1-1h7.6a1 1 0 0 1 .7.3l9 9a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0l-9-9A1 1 0 0 1 3 11.6zM8 6.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 1 0 0-3.6z"/></svg>
      <span>PlayMatch</span>
    </a>
    <!-- Add future sections as more <li> links here; the bar is already sticky and wraps on small screens. -->
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a id="nav-games" href="#/">Games</a></li>
      </ul>
    </nav>
    <div class="nav-tools">
      <select id="reg" aria-label="Region" hidden></select>
      <select id="cur" aria-label="Currency"></select>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>
</body>
</html>
