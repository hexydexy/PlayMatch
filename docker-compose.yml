services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: playmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playmatch}
      POSTGRES_DB: playmatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmatch"]
      interval: 5s
      retries: 10

  price-match:
    build: ./price-match
    restart: unless-stopped
    environment: &pm-env
      DATABASE_URL: postgresql+psycopg://playmatch:${POSTGRES_PASSWORD:-playmatch}@db:5432/playmatch
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      REGIONS: ${REGIONS:-US}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GOGDB_CACHE_DIR: /cache
      SCHEDULE_HOUR_UTC: ${SCHEDULE_HOUR_UTC:-6}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]

  # Runs the daily data job (FX, Steam/Epic snapshots, GOGDB import).
  scheduler:
    build: ./price-match
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    environment: *pm-env
    volumes: [gogdb-cache:/cache]
    depends_on: {db: {condition: service_healthy}}

  # One-shot run:  docker compose run --rm snapshot --seed
  snapshot:
    build: ./price-match
    entrypoint: ["python", "-m", "app.snapshot"]
    environment: *pm-env
    volumes: [gogdb-cache:/cache]
    depends_on: {db: {condition: service_healthy}}
    profiles: [jobs]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [price-match]

volumes:
  pgdata:
  gogdb-cache:
